<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>VIP会員へアップグレード</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        <h1 class="mb-4 text-center">VIPへアップグレード</h1>
                        
                        <div class="form-group justify-content-center my-4">
						    <form th:action="@{/general/user/upgrade}" method="post">
						        <input type="hidden" name="userId" th:value="${upgradeForm.userId}">
						        <input type="hidden" name="role" th:value="${upgradeForm.role}">
						        <input type="hidden" name="amount" th:value="${upgradeForm.amount}"> 
						        
						        <div class="features-box">
						            <p>気になる店の予約可能</p>
						            <p>店舗をお好きなだけお気に入りに追加可能</p>
						            <p>レビューを全件閲覧可能</p>
						            <p>レビューを投稿可能</p>
						            <p>料金は500円</p>
						        </div>
						
						        <button type="submit" class="btn text-black shadow-sm mb-10 w-50 nagoyameshi-btn">決済する</button>
						    </form>
						</div>

                        
                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
