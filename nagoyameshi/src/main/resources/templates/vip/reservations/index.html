<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragment :: meta}"></div>   
    <div th:replace="~{fragment :: styles}"></div>
    <title>予約一覧</title>   
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>
        
        <main>
            <div class="container pt-4 pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xxl-9 col-xl-10 col-lg-11">                          
                        
                        <h1 class="mb-3 text-center">予約一覧</h1>                                                           
                        
                        <div th:if="${param.reserved}" class="alert alert-warning">
                            予約が完了しました。
                        </div> 
                        
                        <table class="table">
                            <thead>
                                <tr>                            
                                    <th scope="col">店名</th>
                                    <th scope="col">予約日</th>
                                    <th scope="col">開始時間</th>
                                    <th scope="col">終了時間</th>
                                    <th scope="col">人数</th>                                        
                                </tr>
                            </thead>  
                            <tbody> 
                                <tr th:each="reservation : ${reservationPage}">
                                    <td>
                                        <a th:href="@{/vip/reservations/__${reservation.getRestaurant().getId()}__}" th:text="${reservation.getRestaurant().getName()}"></a>
                                    </td>
                                    <td th:text="${reservation.getCheckDate()}"></td>
                                    <td th:text="${reservation.getStartTime()}"></td>
                                    <td th:text="${reservation.getFinishTime()}"></td>
                                    <td th:text="${reservation.getPeople} + '名'"></td>
                                </tr>                                    
                            </tbody>
                        </table>                                                                 
                        
                        <!-- ページネーション -->
                        <div th:if="${reservationPage.getTotalPages() > 1}" class="d-flex justify-content-center">
                            <nav aria-label="予約一覧ページ">
                                <ul class="pagination">
                                    <li class="page-item">
                                        <span th:if="${reservationPage.isFirst()}" class="page-link disabled">前</span>
                                        <a th:unless="${reservationPage.isFirst()}" th:href="@{/vip/reservations/index(page=${reservationPage.getNumber() - 1})}" class="page-link nagoyameshi-page-link">前</a>
                                    </li>
                                    <li th:each="i : ${#numbers.sequence(0, reservationPage.getTotalPages() - 1)}" class="page-item">
                                        <span th:if="${i == reservationPage.getNumber()}" class="page-link active nagoyameshi-active" th:text="${i + 1}"></span>
                                        <a th:unless="${i == reservationPage.getNumber()}" th:href="@{/vip/reservations/index(page=${i})}" class="page-link nagoyameshi-page-link" th:text="${i + 1}"></a>
                                    </li>
                                    <li class="page-item">                        
                                        <span th:if="${reservationPage.isLast()}" class="page-link disabled">次</span>
                                        <a th:unless="${reservationPage.isLast()}" th:href="@{/vip/reservations/index(page=${reservationPage.getNumber() + 1})}" class="page-link nagoyameshi-page-link">次</a>
                                    </li>
                                </ul>
                            </nav> 
                        </div>                
                    </div>                          
                </div>
            </div>  
        </main>
        
        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>    
    
    <div th:replace="~{fragment :: scripts}"></div>  
</body>
</html>
