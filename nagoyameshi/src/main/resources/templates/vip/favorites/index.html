<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragment :: meta}"></div>   
    <div th:replace="~{fragment :: styles}"></div>
    <title>お気に入り一覧</title>   
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>
        
        <main>
            <div class="container pt-4 pb-5 nagoyameshi-container">
                <div class="row justify-content-center">
                    <div class="col-xxl-9 col-xl-10 col-lg-11">                          
                        
                        <h1 class="mb-3 text-center">お気に入り一覧</h1>                                                           
                        
                        
                       <div class="mb-3" th:each="favorite : ${favoritePage}">
					    <div class="card h-100">   
					        <div class="row g-0">
					            <!-- 左侧餐厅图片（仅图片可点击跳转） -->
					            <div class="col-md-4"> 
					                <a th:href="@{/restaurants/{id}(id=${favorite.restaurant.getId()})}">
					                    <img th:if="${favorite.restaurant.getImageName()}" 
					                         th:src="@{/storage/__${favorite.restaurant.getImageName()}__}" 
					                         class="card-img-top nagoyameshi-horizontal-card-image" 
					                         alt="店舗画像">                                                     
					                    <img th:unless="${favorite.restaurant.getImageName()}" 
					                         th:src="@{/images/noImage.png}" 
					                         class="card-img-top nagoyameshi-horizontal-card-image" 
					                         alt="NO IMAGE">                                                    
					                </a>
					            </div> 
					
					            <!-- 右侧详情 -->
					            <div class="col-md-8 d-flex flex-column">                                                                                                                        
					                <div class="card-body flex-grow-1">                                    
					                    <h3 class="card-title mb-3" th:text="${favorite.restaurant.getName()}"></h3>                                            
					                    <hr class="mb-3">
					                    <p class="card-text mb-2">
					                        <span th:text="${favorite.restaurant.getDescription()}"></span>
					                    </p>                                                    
					                    <p class="card-text mb-2">
					                        <small class="text-muted" th:text="${'〒' + favorite.restaurant.getPostalCode()}"></small>
					                        <small class="text-muted" th:text="${favorite.restaurant.getAddress()}"></small>                                                      
					                    </p> 
					                </div>
					
					                <!-- 取消收藏按钮 -->
					                <div class="card-footer bg-white border-0 text-end">
					                    <form method="post" th:action="@{/vip/favorites/remove}">
					                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
					                        <input type="hidden" name="restaurantId" th:value="${favorite.restaurant.getId()}" />
					                        <button type="submit" class="btn btn-danger btn-sm">
					                            <i class="fa fa-heart"></i> お気に入りを解除
					                        </button>
					                    </form>
					                </div>
					            </div>
					        </div>
					    </div>    
					</div>

                        
                        <!-- ページネーション -->
                        <div th:if="${favoritePage.getTotalPages() > 0}" class="d-flex justify-content-center">
                            <nav aria-label="お気に入り一覧ページ">
                                <ul class="pagination">
                                    <li class="page-item">
                                        <span th:if="${favoritePage.isFirst()}" class="page-link disabled">前</span>
                                        <a th:unless="${favoritePage.isFirst()}" th:href="@{/vip/favorites/index(page=${favoritePage.getNumber() - 1})}" class="page-link nagoyameshi-page-link">前</a>
                                    </li>
                                    <li th:each="i : ${#numbers.sequence(0, favoritePage.getTotalPages() - 1)}" class="page-item">
                                        <span th:if="${i == favoritePage.getNumber()}" class="page-link active nagoyameshi-active" th:text="${i + 1}"></span>
                                        <a th:unless="${i == favoritePage.getNumber()}" th:href="@{/vip/favorites/index(page=${i})}" class="page-link nagoyameshi-page-link" th:text="${i + 1}"></a>
                                    </li>
                                    <li class="page-item">                        
                                        <span th:if="${favoritePage.isLast()}" class="page-link disabled">次</span>
                                        <a th:unless="${favoritePage.isLast()}" th:href="@{/vip/favorites/index(page=${favoritePage.getNumber() + 1})}" class="page-link nagoyameshi-page-link">次</a>
                                    </li>
                                </ul>
                            </nav> 
                        </div>                
                    </div>                          
                </div>
            </div>  
        </main>
        
        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>    
    
    <div th:replace="~{fragment :: scripts}"></div>  
</body>
</html>
