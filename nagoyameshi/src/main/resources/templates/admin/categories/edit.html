<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragment :: meta}"></div>   
    <div th:replace="~{fragment :: styles}"></div>
    <!-- Flatpickr -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>

    <!-- Bootstrap Bundle JS (includes Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>カテゴリー編集</title>   
</head>
<body>
    <div class="nagoyameshi-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>
        
        <main>
			<div class="container pt-4 pb-5 nagoyameshi-container">
				<div class="row justify-content-center">
					<div class="col-xl-5 col-lg-6 col-md-8">
						
						<h1 class="mb-4 text-center" text="カテゴリー編集"></h1>
						<form method="post" th:action="@{/admin/categories/update}" th:object="${categoryEditForm}">
                                 <input type="hidden" th:field="*{id}">

							     <div class="form-group row mb-3">
							        <div class="col-md-5">
							            <label for="name" class="col-form-label text-md-left fw-bold">
							                <div class="d-flex align-items-center">
							                    <span class="me-1">カテゴリー</span>
							                </div>
							            </label>
							        </div>
							        <div class="col-md-7">
							            <div th:if="${#fields.hasErrors('category')}" class="text-danger small mb-2" th:errors="*{category}"></div>
							            <input class="form-control" th:field="*{category}" placeholder="カテゴリーを入力してください"></input>  
							        </div>
							    </div>                                                                                
							    
							    <div class="form-group d-flex justify-content-center my-4">
							        <button type="submit" class="btn text-black shadow-sm w-50 nagoyameshi-btn">更新</button>
							    </div>
                             </form>
						
					</div>
				</div>
			</div>
		</main>
        
        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>    
    
    <div th:replace="~{fragment :: scripts}"></div>  
</body>
</html>
