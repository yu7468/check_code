<!DOCTYPE html>
 <html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">    
     <head>
         <div th:replace="~{fragment :: meta}"></div>   
              
         <div th:replace="~{fragment :: styles}"></div>
           
         <title>カテゴリー一覧</title>   
     </head>
     <body>
         <div class="nagoyameshi-wrapper">
             <!-- ヘッダー -->
             <div th:replace="~{fragment :: header}"></div>
             
             <main>
                 <div class="container pt-4 pb-5 nagoyameshi-container">
                     <div class="row justify-content-center">
                         <div class="col-xxl-9 col-xl-10 col-lg-11">
                             
                             <h1 class="mb-4 text-center">カテゴリー一覧</h1>   
                             
                             <div class="d-flex justify-content-between align-items-end">
                                 <form method="get" th:action="@{/admin/categories}" class="mb-3">
                                     <div class="input-group">
                                         <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="カテゴリー名">
                                         
                                         <button type="submit" class="btn text-black shadow-sm nagoyameshi-btn">検索</button> 
                                     </div>              
                                 </form>    
                                 <a th:href="@{/admin/categories/register}" class="btn text-black shadow-sm mb-3 nagoyameshi-btn">新規登録</a>                                                                                            
                             </div>                                                         
                 
                             <div th:if="${successMessage}" class="alert alert-warning">
                                 <span th:text="${successMessage}"></span>
                             </div>   
                             
                             <table class="table">
                                 <thead>
                                     <tr>
                                         <th scope="col">ID</th>
                                         <th scope="col">カテゴリー名</th>                         
                                         <th scope="col"></th>
                                         <th scope="col"></th>
                                     </tr>
                                 </thead>   
                                 <tbody>                                                     
                                     <tr th:each="category : ${categoryPage}">
                                         <td th:text="${category.getId()}"></td>
                                         <td th:text="${category.getName()}"></td>
                                         <td><a th:href="@{/admin/categories/edit/{id}(id=${category.getId()})}">編集</a></td> 
                                         <td><a href="#" class="nagoyameshi-link-danger" data-bs-toggle="modal" th:data-bs-target="${'#deleteRestaurantModal' + category.getId()}">削除</a></td>                                                                                 
                                     </tr>                                      
                                 </tbody>
                             </table> 
                             
                             <!-- 削除用モーダル -->
                                         <div class="modal fade" th:id="${'deleteRestaurantModal' + restaurant.getId()}" tabindex="-1" th:aria-labelledby="${'deleteRestaurantModalLabel' + restaurant.getId()}">
                                             <div class="modal-dialog">
                                                 <div class="modal-content">
                                                     <div class="modal-header">
                                                         <h5 class="modal-title" th:id="${'deleteRestaurantModalLabel' + restaurant.getId()}" th:text="${restaurant.getName() + 'を削除してもよろしいですか？'}"></h5>
                                                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                                                     </div>
                                                     <div class="modal-footer">
                                                         <form method="post"th:action="@{/admin/restaurants/__${restaurant.getId()}__/delete}">
                                                             <button type="submit" class="btn nagoyameshi-btn-danger text-black shadow-sm">削除</button>
                                                         </form>
                                                     </div>
                                                 </div>
                                             </div>
                                         </div> 
                             
                             
                         </div>
                     </div>
                 </div>
             </main>
             
             <!-- フッター -->
             <div th:replace="~{fragment :: footer}"></div>
         </div>    
         
         <div th:replace="~{fragment :: scripts}"></div>  
   </body>
 </html>
