<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<!-- meta要素の部品化 -->
		<div th:fragment="meta" th:remove="tag">
		 <meta charset="UTF-8">
		 <meta name="viewport" content="width=device-width, initial-scale=1.0">
		</div>
		 
		 <!-- link要素の部品化 -->
         <div th:fragment="styles" th:remove="tag">
			 <!-- Bootstrap -->
			 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
         
         	<!-- Fonts -->
			<link rel="preconnect" href="https://fonts.gstatic.com">
			<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
	 		<link th:href="@{/css/style.css}" rel="stylesheet" >
         </div>
         
         <title>部品化用のHTMLファイル</title>
	</head>
	
	<body>
		<!-- ヘッダーの部品化 -->
         <div th:fragment="header" th:remove="tag">
             <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm nagoyameshi-navbar">
                 <div class="container">
                     <a class="navbar-brand d-flex" th:href="@{/}">                        
                         <img class="nagoyameshi-logo me-1" th:src="@{/storage/logo.jpg}" alt="nagoyameshi">
                         <h1>NAGOYAMESHI</h1>                        
                     </a>
                     <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                         <span class="navbar-toggler-icon"></span>
                     </button>
                     
                     <div class="collapse navbar-collapse" id="navbarSupportedContent">                                    
                         <ul class="navbar-nav ms-auto">    
                             <!-- 未ログインであれば表示する -->
                             <li class="nav-item" sec:authorize="isAnonymous()">
                                 <a class="nav-link" th:href="@{/login}">ログイン</a>
                             </li> 
                             <li class="nav-item" sec:authorize="isAnonymous()">
                                 <a class="nav-link" th:href="@{/signup}">会員登録</a>
                             </li>                                                      
                     
                             <!-- 普通会員ログイン済みであれば表示する --> 
                             <li class="nav-item dropdown" sec:authorize="hasRole('GENERAL')">
                                 <a id="navbarDropdownGeneral" class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" v-pre>
                                     <span sec:authentication="principal.user.name"></span>
                                 </a>
         
                                 <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownGeneral">
									 <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/general/user}">会員情報</a>  
                                     <div class="dropdown-divider"></div>                                                                  
                                     <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                                         ログアウト
                                     </a>
                                     <form class="d-none" id="logout-form" th:action="@{/logout}" method="post"></form>                                     
                                 </div>
                             </li>
                             
                             <!-- VIP会員登录之后表示 -->
							<li class="nav-item dropdown" sec:authorize="hasRole('VIP')">
							    <a id="navbarDropdownVip" class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" v-pre>
							        <span th:text="'* ' + ${#authentication.principal.user.name}"></span>
							    </a>
							
							    <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownGeneral">
							        <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/general/user}">会員情報</a>
							        <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/vip/reservations/index}">予約一覧</a>
							        <a class="dropdown-item nagoyameshi-dropsown-item" th:href="@{/vip/favorites/index}">お気に入り一覧</a>
							        <div class="dropdown-divider"></div>
							        <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
							            ログアウト
							        </a>
							        <form class="d-none" id="logout-form" th:action="@{/logout}" method="post"></form>
							    </div>
							</li>                         
                                 
                             <!-- 管理者であれば表示する -->    
                             <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                                 <a id="navbarDropdownAdmin" class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" v-pre>
                                     管理者メニュー
                                 </a>
         
                                 <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownAdmin">                                                                                            
                                     <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/admin/restaurants}">料理店一覧</a>
                                     <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/admin/users}">会員一覧</a>                                                                                                     
                                                               
                                     <div class="dropdown-divider"></div>
                                     
                                     <a class="dropdown-item nagoyameshi-dropdown-item" th:href="@{/logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                                         ログアウト
                                     </a>
                                     <form class="d-none" id="logout-form" th:action="@{/logout}" method="post"></form> 
                                 </div>
                             </li>                           
                         </ul>                                                                    
                 </div>
             </nav>
         </div>
         
         <!-- フッターの部品化 -->
         <div th:fragment="footer" th:remove="tag">
             <footer>
                 <div class="d-flex justify-content-center align-items-center h-100">
                     <p class="text-center text-muted small mb-0">&copy; NAGOYAMESHI All rights reserved.</p>      
                 </div>                 
             </footer>
         </div>
         
         <!-- script要素の部品化 -->
         <div th:fragment="scripts" th:remove="tag">
             <!-- Bootstrap -->
             <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
         </div>
         
	</body>
</html>
